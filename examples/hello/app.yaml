name: hello

services:
  web:
    command: node server.mjs
    resources:
      memory: 128M
    healthcheck:
      path: /health
      timeout: 20s

# Domains are not set here: add them on the app (dashboard → app → Domains, `freighter domain add`, or the API).

environment:
  GREETING: hello

releases:
  keep: 5
