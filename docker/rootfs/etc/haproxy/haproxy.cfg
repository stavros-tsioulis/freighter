global
    log stdout format raw local0
    maxconn 2000
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ---- the two frontends of an ordinary HAProxy setup, with the lines `freighter haproxy setup` asks you to add ----
frontend http
    bind :80
    acl freighter_acme path_beg /.well-known/acme-challenge/
    use_backend freighter_acme if freighter_acme
    # (lab) the published HTTPS port differs from 443, so redirect to it explicitly
    http-request redirect location https://%[req.hdr(host),field(1,:)]:__PUBLIC_HTTPS_PORT__%[pathq] code 301 if !{ ssl_fc } !freighter_acme { req.hdr(host),field(1,:),lower,map(/etc/haproxy/freighter/https.map) -m found }
    use_backend %[req.hdr(host),field(1,:),lower,map(/etc/haproxy/freighter/hostnames.map)] if { req.hdr(host),field(1,:),lower,map(/etc/haproxy/freighter/hostnames.map) -m found }
    default_backend lab_nothing_here

frontend https
    bind :443 ssl crt /etc/haproxy/freighter/certs/
    use_backend %[req.hdr(host),field(1,:),lower,map(/etc/haproxy/freighter/hostnames.map)] if { req.hdr(host),field(1,:),lower,map(/etc/haproxy/freighter/hostnames.map) -m found }
    default_backend lab_nothing_here

backend lab_nothing_here
    http-request return status 503 content-type text/plain string "HAProxy is up, but no Freighter app is routed for this host name.\n"
